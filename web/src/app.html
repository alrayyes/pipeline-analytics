<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#0e7c86" />
		<meta
			name="description"
			content="Self-hosted pipeline analytics for GitHub Actions and Forgejo Actions"
		/>
		<script>
			// Applied before the app hydrates so there's no flash of the
			// wrong theme -- this is a client-only SPA (ssr: false), so
			// there's no server-rendered HTML to get this right instead.
			(() => {
				try {
					const stored = localStorage.getItem('theme');
					const dark =
						stored === 'dark' ||
						(stored !== 'light' &&
							window.matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.classList.toggle('dark', dark);
				} catch (_) {}
			})();
		</script>
		<script>
			// Not needed to paint, and a <link rel="manifest"> in the head is
			// fetched with the page's critical requests, so
			// network-dependency-tree-insight counts it as a chain (#527).
			// Added once the page has loaded instead.
			addEventListener('load', () => {
				const link = document.createElement('link');
				link.rel = 'manifest';
				link.href = '/manifest.json';
				document.head.append(link);
			});
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
