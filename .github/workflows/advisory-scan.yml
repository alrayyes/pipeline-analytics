name: Advisory scan

# Audits the default branch and keeps one open ticket per lockfile for what it
# finds: opened when advisories appear, updated when they change, closed when
# the audit is clean. A pull request is gated separately in ci.yml and fails
# only on what it introduces. No advisory is ignored anywhere (#657).
on:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]
    paths:
      [
        go.mod,
        go.sum,
        web/package.json,
        web/bun.lock,
        .github/workflows/advisory-scan.yml,
      ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: scan (go)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: alrayyes/advisory-scan@425418a63e80eb10142fbd2e82127b7ef3a51d68 # post v0.1.0
        with:
          mode: scan
          title: Dependency advisories (Go)
          command: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
          labels: dependencies

  web:
    name: scan (web)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: alrayyes/advisory-scan@425418a63e80eb10142fbd2e82127b7ef3a51d68 # post v0.1.0
        with:
          mode: scan
          title: Dependency advisories (web)
          command: bun audit
          working-directory: web
          labels: dependencies
