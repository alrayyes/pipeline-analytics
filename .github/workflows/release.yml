name: Release

on:
  push:
    branches: [main]
  # Escape hatch for a release whose goreleaser run never fired --
  # release-please's own job can succeed (or even fail outright) without
  # release_created ever coming back "true" on a transient error right
  # after it creates the tag/release, and since the release then already
  # exists, no later push ever retries it (confirmed live: v0.3.0 and
  # v0.4.0 both shipped a tagged GitHub release with zero binaries and no
  # GHCR image). This reruns just the goreleaser job against an existing
  # tag, without needing release-please to report anything.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build artifacts for, e.g. v0.4.0"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: release-please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    name: goreleaser
    needs: release-please
    if: |
      always() &&
      (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
          fetch-depth: 0
      # Unlike CI's bun-version pin, this one doesn't need to stay below
      # 1.4 -- Dependabot never touches this job, only PRs against
      # web/package.json, and this job needs to build whatever tag it's
      # given, including one tagged before the repo's bun.lock moved back
      # to v1 (confirmed live: bun 1.3.14 can't read v0.3.0/v0.4.0's
      # v2-format lockfile at all, not even to install, so building an old
      # tag needs a bun that reads both formats).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

  screenshots:
    name: refresh README screenshots
    needs: release-please
    if: |
      always() &&
      (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - working-directory: web
        run: bun install --frozen-lockfile
      - working-directory: web
        run: bunx playwright install --with-deps chromium
      - run: ./web/scripts/capture-screenshots.sh
      # Screenshots regenerate byte-identical when the UI hasn't changed
      # since the last release -- only push a branch/PR when they did.
      - id: diff
        run: |
          git add docs/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Opens a PR rather than pushing to main directly -- this isn't the
      # release job's version/CHANGELOG.md push exception, it's the normal
      # "commit and push to a branch needs no separate ask" rule, and a
      # screenshot diff is worth a human's eyes before it merges.
      - if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B docs/refresh-screenshots
          git commit -m "docs: refresh README screenshots"
          git push --force origin docs/refresh-screenshots
          if ! gh pr view docs/refresh-screenshots >/dev/null 2>&1; then
            gh pr create --title "docs: refresh README screenshots" \
              --base main --head docs/refresh-screenshots \
              --body "Automated screenshot refresh after ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}. Review the diff before merging."
          fi
