name: wretry smoke (temporary)
on:
  pull_request:
    paths: [".github/workflows/wretry-smoke.yml"]
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go_version: ${{ fromJSON(steps.go.outputs.outputs).go-version }}
    steps:
      - uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea # v3.8.0
        id: go
        with:
          attempt_limit: 3
          attempt_delay: 1000
          action: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
          with: |
            go-version: "1.25"
      - env:
          GO_VERSION: ${{ fromJSON(steps.go.outputs.outputs).go-version }}
        run: |
          echo "go-version=$GO_VERSION"
          case "$GO_VERSION" in 1.25*) ;; *) exit 1 ;; esac
          go version
  consumer:
    needs: smoke
    if: startsWith(needs.smoke.outputs.go_version, '1.25')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: echo "the job-level condition read the wrapped action's output - ${{ needs.smoke.outputs.go_version }}"
