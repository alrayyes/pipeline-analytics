StylesPath = styles
MinAlertLevel = warning
Packages = Google, proselint
Vocab = House

[*.md]
BasedOnStyles = Vale, Google, proselint
Vale.Terms = YES
Google.We = NO
# This account's own prose style uses a spaced " -- " as its em-dash, used
# throughout its own rule files -- fighting that convention file by file
# isn't worth it.
Google.EmDash = NO
# CLI, API, and the like are exactly the terms a developer-tool README
# should use freely.
Google.WordList = NO
