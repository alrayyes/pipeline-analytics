name: CI

on:
  pull_request:
  push:
    branches: [main]

# A pull request's newer push cancels its older run. A push to main gets a
# group of its own (the commit), so no merge cancels the run of the one before
# it: a cancelled run on main is neither green nor red.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The root package.json's `prepare` script is `lefthook install`, which a
# pipeline install must not run (rules/tooling.md).
env:
  LEFTHOOK: "0"

jobs:
  # Decides which jobs below have anything to check. Each later job runs on
  # `needs.changes.outputs.<group>` and is skipped otherwise; GitHub reports a
  # job skipped by a conditional as a success, so the required checks on main
  # still pass (a workflow-level `paths:` filter would leave them pending).
  # This job always runs, so every pull request has a status. The groups and
  # their paths live in .github/scripts/changes.sh, and its test runs here.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.filter.outputs.api }}
      binary: ${{ steps.filter.outputs.binary }}
      docker: ${{ steps.filter.outputs.docker }}
      go: ${{ steps.filter.outputs.go }}
      goreleaser: ${{ steps.filter.outputs.goreleaser }}
      lint: ${{ steps.filter.outputs.lint }}
      ltex: ${{ steps.filter.outputs.ltex }}
      md: ${{ steps.filter.outputs.md }}
      mdlint: ${{ steps.filter.outputs.mdlint }}
      package: ${{ steps.filter.outputs.package }}
      vale: ${{ steps.filter.outputs.vale }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: test the filter
        run: |
          .github/scripts/changes.test.sh
          .github/scripts/hook-guard.test.sh
          .github/scripts/ci-needs.test.sh
          .github/scripts/lefthook-off.test.sh
          .github/scripts/lefthook-parity.test.sh
          .github/scripts/test-analytics.test.sh
          .github/scripts/assemble-reports.test.sh
          .github/scripts/wait-for-artifact.test.sh
          .github/scripts/playwright-image.test.sh
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="$PUSH_BEFORE"
          if [ "$EVENT" = pull_request ]; then base="$PR_BASE"; fi

          # No usable base (a new branch, a force push that dropped it): run
          # everything rather than filter on a guess. A push to main always
          # runs everything: its deploy replaces the whole Pages site, so a
          # docs-only push that skipped the report jobs would delete their
          # reports (rules/published-reports.md).
          if [ "$EVENT" = push ] || [ -z "$base" ] || [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            .github/scripts/changes.sh --all | tee -a "$GITHUB_OUTPUT" >> "$GITHUB_STEP_SUMMARY"
          else
            git diff --name-only "$base" HEAD | .github/scripts/changes.sh | tee -a "$GITHUB_OUTPUT" >> "$GITHUB_STEP_SUMMARY"
          fi

  test:
    name: build, vet, test
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # One patch ahead of go.mod on purpose: 1.27.2 carries the standard-library
      # fixes govulncheck reports, but golangci-lint (built with Go 1.27.0) can't
      # type-check against it, so go.mod and the lint job stay on 1.27.1. Move
      # them together once a golangci-lint release is built with 1.27.2 or later.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
      - run: go build ./...
      - run: go vet ./...
      - run: go run gotest.tools/gotestsum@v1.13.0 --junitfile junit.xml -- -race -coverprofile=coverage.out ./...
      # The published coverage is Cobertura, which every viewer reads, plus the
      # HTML view; both are built on pull requests too so a broken conversion
      # fails before the merge. Only the upload is main-only.
      - run: |
          go run github.com/boumenot/gocover-cobertura@v1.4.0 < coverage.out > coverage.xml
          go tool cover -html=coverage.out -o coverage.html
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-go
          path: |
            junit.xml
            coverage.out
            coverage.xml
            coverage.html
          retention-days: 1
      # Dependabot-triggered runs get no repo secrets, only DEPENDABOT_-
      # prefixed ones (releases.md's "Dependency bots" section) --
      # CODECOV_TOKEN resolves empty there and main's branch protection
      # makes Codecov reject an unauthenticated upload outright, failing
      # this job on every Dependabot PR regardless of what it bumps.
      # A version-bump PR has no coverage story of its own to report.
      # fail_ci_if_error is false on all four Codecov steps: its API 403s now
      # and then (#602), and an upload error says nothing about the code.
      - if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: go
          fail_ci_if_error: false
      # Test results go up even when a test failed: a red run is what Test
      # Analytics exists to explain, and the coverage step above never runs then.
      - if: ${{ !cancelled() && github.actor != 'dependabot[bot]' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: junit.xml
          flags: go
          fail_ci_if_error: false
      - name: go mod tidy -diff
        run: go mod tidy -diff
      - name: go.mod formatting
        run: |
          go mod edit -fmt go.mod
          git diff --exit-code go.mod
      # Fails only on an advisory this change introduces over its base; the
      # rest live in the "Dependency advisories (Go)" ticket that
      # advisory-scan.yml keeps (#657).
      - name: govulncheck (gate)
        uses: alrayyes/advisory-scan@c9f794de4354b870e159510f036779baf20f4a2f # v0.3.1
        with:
          mode: gate
          command: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  lint:
    name: golangci-lint
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

  api-spec:
    name: redocly-lint
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bunx @redocly/cli lint --format=github-actions

  # The OWASP API Security ruleset, in its own job so a red run says a
  # security finding, not a spec-correctness one (rules/api.md, "Spectral").
  # Only error-severity findings fail it; .spectral.yaml says why each rule
  # that is off is.
  spectral:
    name: spectral (owasp)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bunx spectral lint openapi/openapi.yaml

  package-json:
    name: sort-package-json
    needs: changes
    if: needs.changes.outputs.package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bunx sort-package-json --check package.json web/package.json

  frontend:
    name: frontend
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun run lint:tailwind
      - run: bun run test:coverage
      # bun writes lcov, not Cobertura; convert it for the published report.
      # Built on pull requests too, uploaded on main only.
      - run: |
          pip install --user lcov_cobertura==2.1.1
          python3 -m lcov_cobertura coverage/lcov.info --output coverage/coverage.xml
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-frontend
          path: |
            web/junit.xml
            web/coverage/lcov.info
            web/coverage/coverage.xml
          retention-days: 1
      # Same reasoning as the Go job's identical guard above.
      - if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: web/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
      - if: ${{ !cancelled() && github.actor != 'dependabot[bot]' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: web/junit.xml
          flags: frontend
          fail_ci_if_error: false
      # The build uploads bundle analysis through @codecov/vite-plugin. Without
      # a token (Dependabot, a fork) the plugin does a dry run, so this step
      # still passes (web/src/bundleAnalysis.ts).
      - run: bun run build
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      # Same gate as the Go job's; see advisory-scan.yml for the ticket.
      - name: bun audit (gate)
        uses: alrayyes/advisory-scan@c9f794de4354b870e159510f036779baf20f4a2f # v0.3.1
        with:
          mode: gate
          command: bun audit
          working-directory: web

  # A surviving mutant fails the job (thresholds.break is 100 in
  # stryker.conf.mjs, rules/javascript.md). Scoped to the handful of modules the unit-
  # test layer above actually covers (stryker.conf.mjs), so this stays
  # cheap enough (a few seconds) for every push; revisit if that changes
  # as more of web/ grows real unit coverage.
  mutation:
    name: mutation testing (stryker)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run test:mutation
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: web/reports/mutation/
          retention-days: 7

  e2e:
    name: e2e
    needs: changes
    if: needs.changes.outputs.binary == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Prebuilt image (alrayyes/ci-playwright): Playwright's browsers, Bun, git and
    # gh are already in it, so no step downloads Chromium or runs apt. The tag
    # must be the @playwright/test version in web/bun.lock exactly;
    # .github/scripts/playwright-image.test.sh fails the `changes` job when they
    # differ, so bump both together. It has no Go, so setup-go stays.
    container:
      image: ghcr.io/alrayyes/ci-playwright:1.64.1@sha256:8475bb332de43de88e3a442ed5c168586a378790b6a5c109753e7de93bc1dd3d
      # Chromium shares memory through IPC; Playwright's Docker guide asks for this.
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
      # The container runs as root over a workspace the runner owns, so git
      # (go's VCS stamping) otherwise fails with dubious ownership.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - working-directory: web
        run: bun install --frozen-lockfile
      # global-setup.ts builds the frontend and the Go binary once, and
      # each test starts its own server from that binary (fixtures.ts) --
      # same shape as production, not a dev-server/API proxy.
      #
      # Wrapped in a job-level retry on top of Playwright's own in-run
      # retries (playwright.config.ts): the dashboard journey's one real,
      # unmocked reload occasionally hangs outright (#251, not yet
      # root-caused) rather than just running slow, which Playwright's
      # own retries -- reruns on the *same* runner -- don't reliably
      # recover from. A second attempt on a fresh runner does.
      - uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 8
          max_attempts: 2
          command: cd web && bun run test:e2e
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-e2e
          path: web/playwright-results/e2e.xml
          retention-days: 1
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  lighthouse:
    name: lighthouse
    needs: changes
    if: needs.changes.outputs.binary == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - working-directory: web
        run: bun install --frozen-lockfile
      # web/scripts/lighthouse.sh builds the frontend and the Go binary
      # (same shape as web/scripts/capture-screenshots.sh), serves it, and
      # runs lhci autorun against /login and, signed in through a virtual
      # authenticator, the pages behind the passkey
      # (docs/adr/0002-webauthn-only-authentication.md).
      - run: web/scripts/lighthouse.sh
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-report
          path: web/.lighthouseci/
          # .lighthouseci is a hidden directory, which upload-artifact skips by default.
          include-hidden-files: true
          retention-days: 7

  goreleaser-check:
    name: goreleaser check
    needs: changes
    if: needs.changes.outputs.goreleaser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: check

  # Commit messages again in CI, not only in the commit-msg hook (rules/commit.md):
  # a commit made with the hook off, or in an editor with none, still has to
  # read as Conventional Commits. Never filtered by path (rules/ci.md), and
  # pull requests only: a push to main has no base to lint a range against.
  # Merge commits (the bot's "update branch") are ignored by commitlint itself.
  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: >
          bunx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  # Layout and structure. Prettier decides layout; markdownlint-cli2 then
  # judges what Prettier produced (markdown.md's ordering -- reversed, and
  # markdownlint fights something Prettier is about to overwrite).
  markdown-format:
    name: markdown format (prettier)
    needs: changes
    if: needs.changes.outputs.md == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bunx prettier --check '**/*.{md,yml,yaml}'

  markdown-lint:
    name: markdown structure (markdownlint)
    needs: changes
    if: needs.changes.outputs.mdlint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bunx markdownlint-cli2 "**/*.md"

  # Mechanics: grammar, spelling, punctuation -- has a right answer, fails
  # the build. Style: house voice, weasel words -- advice, warns only, not
  # a required check. Separate jobs so a red run says which tier failed.
  mechanics:
    name: prose mechanics (ltex)
    needs: changes
    if: needs.changes.outputs.ltex == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: >
          docker run --rm -v "$PWD:/data" -w /data
          ghcr.io/alrayyes/ltex-cli-plus@sha256:00c30809802234d6c43b0ce0b295075bd0aff9c576aaba57433bc8baf314398c
          --client-configuration=/data/.ltex.json
          README.md CONTRIBUTING.md SECURITY.md .github/PULL_REQUEST_TEMPLATE.md openspec/specs

  style:
    name: prose style (vale)
    needs: changes
    if: needs.changes.outputs.vale == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The official image, as markdown.md's "Running Vale" says. Its
    # entrypoint is vale itself, so it's cleared; the image ships node but
    # neither git nor bash, which the checkout and the script need. The
    # image reference lives in scripts/lint-prose.sh, the hooks' entry point
    # too, so there is one place to bump it.
    container:
      image: jdkato/vale:v3.21.0@sha256:8a5a05b5c1751c6a6132ca459d67ffe3ad2cc338abc5795ee634470dd39de9c4
      options: --entrypoint ""
    steps:
      - run: apk add --no-cache bash git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/lint-prose.sh

  docker:
    name: docker build
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: hadolint
        run: docker run --rm -i -v "$PWD/.hadolint.yaml:/.hadolint.yaml:ro" hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d hadolint --config /.hadolint.yaml - < Dockerfile
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
      - run: go build -o pipeline-analytics ./cmd/pipeline-analytics
      - run: docker build -t pipeline-analytics:ci .

  # Publishes docs/api/index.html (Scalar, rendering the same
  # spec api-spec just linted) to GitHub Pages. `needs: api-spec` only
  # works because both jobs live in this one workflow -- Actions has no
  # cross-workflow `needs`, so a separate workflow file here could only
  # fake the dependency with workflow_run, which doesn't block a bad spec
  # the way a real needs: does. web/ deploys nowhere (this binary
  # go:embeds it and serves it itself, ARCHITECTURE.md), so there's
  # nothing else on Pages to collide with.
  #
  # The uploaded artifact mirrors docs/api/ at its real repo path rather
  # than flattening it to the site root, matching Hush-Hush and
  # forge-dashboard: apis.ryankes.eu is a GitHub Pages user-site custom
  # domain, and every project site under it is served as a subpath of it,
  # so this has to land at apis.ryankes.eu/pipeline-analytics/docs/api/,
  # not at the site root. Uploading `docs/api/` directly (as before) put
  # index.html at the root instead -- confirmed live, alrayyes/alrayyes.
  # github.io#26.
  pages-deploy:
    name: deploy API docs
    # Every other job, so a red one can't finish after the docs already
    # shipped (rules/ci.md). .github/scripts/ci-needs.test.sh fails the pull
    # request that adds a job without listing it here. Most of these are
    # skipped when their files didn't change, and a skipped need would skip
    # this job too, so the condition names what must not have happened
    # instead of requiring every need to succeed.
    needs:
      [
        changes,
        test,
        lint,
        api-spec,
        spectral,
        package-json,
        frontend,
        mutation,
        e2e,
        lighthouse,
        goreleaser-check,
        markdown-format,
        markdown-lint,
        mechanics,
        style,
        docker,
        commitlint,
      ]
    if: >-
      !failure() && !cancelled() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Staged under _site/docs/api/ so the deployed URL keeps the
      # docs/api/ prefix -- index.html's apiDescriptionUrl is the relative
      # './openapi.yaml', so the copy has to land right beside it, same as
      # it did when both were flattened to the site root.
      - run: |
          mkdir -p _site/docs/api
          cp docs/api/index.html _site/docs/api/index.html
          cp docs/api/llms.txt _site/docs/api/llms.txt
          cp openapi/openapi.yaml _site/docs/api/openapi.yaml
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: "{reports-*,lighthouse-report}"
      - run: .github/scripts/assemble-reports.sh artifacts _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      # deploy-pages looks the artifact up in the run's artifact list, which can
      # trail the upload by a moment (#606). Wait until it shows.
      - run: .github/scripts/wait-for-artifact.sh github-pages
        env:
          GH_TOKEN: ${{ github.token }}
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # The deploy succeeds whether or not the files are reachable, so fetch the
      # real one. The retries cover the CDN catching up.
      - name: Prove the live report URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --location --retry 6 --retry-delay 10 \
            --retry-all-errors --output coverage.xml "${PAGE_URL%/}/reports/coverage/coverage.xml"
          grep -q '<coverage ' coverage.xml
          # A Lighthouse report under its stable name, the one a cached
          # manifest keeps pointing at.
          curl --fail --silent --show-error --location --retry 6 --retry-delay 10 \
            --retry-all-errors --output login.report.html "${PAGE_URL%/}/reports/lighthouse/login.report.html"
          grep -q -i '<html' login.report.html
