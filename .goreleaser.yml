version: 2

project_name: pipeline-analytics

before:
  hooks:
    - sh -c "cd web && bun install --frozen-lockfile && bun run build"
    - go mod tidy

builds:
  - main: ./cmd/pipeline-analytics
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  mode: keep-existing

dockers:
  - image_templates:
      - "ghcr.io/alrayyes/pipeline-analytics:{{ .Version }}-amd64"
    dockerfile: Dockerfile
    use: buildx
    goarch: amd64
    build_flag_templates:
      - --platform=linux/amd64
  - image_templates:
      - "ghcr.io/alrayyes/pipeline-analytics:{{ .Version }}-arm64"
    dockerfile: Dockerfile
    use: buildx
    goarch: arm64
    build_flag_templates:
      - --platform=linux/arm64

docker_manifests:
  - name_template: "ghcr.io/alrayyes/pipeline-analytics:{{ .Version }}"
    image_templates:
      - "ghcr.io/alrayyes/pipeline-analytics:{{ .Version }}-amd64"
      - "ghcr.io/alrayyes/pipeline-analytics:{{ .Version }}-arm64"
  - name_template: "ghcr.io/alrayyes/pipeline-analytics:latest"
    image_templates:
      - "ghcr.io/alrayyes/pipeline-analytics:{{ .Version }}-amd64"
      - "ghcr.io/alrayyes/pipeline-analytics:{{ .Version }}-arm64"
