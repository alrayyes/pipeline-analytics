name: Release PR auto-merge

on: pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # release-please's own branch naming, not an actor check -- its PR here
    # is opened under RELEASE_TOKEN (a PAT), so it's authored as the repo
    # owner rather than github-actions[bot].
    if: startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # RELEASE_TOKEN, not GITHUB_TOKEN: a merge performed with the default
      # token doesn't trigger release.yml on the resulting push (GitHub's
      # own anti-recursion behavior), so the release commit's tag/
      # goreleaser/screenshots never run promptly -- they only get created
      # later, as a side effect of whatever push happens to trigger
      # release.yml next (#145). required_approving_review_count is 0 on
      # this repo, so there's no review step this bypasses.
      - run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
