# Silent on success, full output on failure: the default banner and per-job
# lines are pure overhead once a hook's output lands in an agent's tool
# result (rules/linting.md).
output: [failure]

# CI-only, on purpose: govulncheck. Its database changes without a commit,
# so a pass here proves nothing the pipeline won't re-check.
# CI-only, on purpose: bun audit. Advisories land overnight, same reason.
#
# pre-commit fixes and restages; pre-push checks the whole tree and never
# writes -- go-lint.md/go-mod.md/linting.md's split. Go commands run
# through Docker so the host's go/golangci-lint installs never drift from
# what CI pins (go-mod.md).
pre-commit:
  parallel: true
  commands:
    go-fmt:
      glob: "*.go"
      run: >
        mkdir -p "$HOME/.cache/go-build-docker" "$HOME/.cache/go-mod-docker" &&
        docker run --rm --user "$(id -u):$(id -g)"
        -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        golang:1.27.1-bookworm gofmt -w {staged_files}
      stage_fixed: true
    go-mod-fmt:
      glob: "go.mod"
      run: >
        mkdir -p "$HOME/.cache/go-build-docker" "$HOME/.cache/go-mod-docker" &&
        docker run --rm --user "$(id -u):$(id -g)"
        -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOMODCACHE=/gomod -v "$HOME/.cache/go-mod-docker:/gomod"
        golang:1.27.1-bookworm go mod edit -fmt go.mod
      stage_fixed: true
    biome:
      root: "web/"
      glob: "web/**/*.{js,ts,svelte,json,css}"
      run: bunx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    sort-package-json:
      glob:
        - "package.json"
        - "web/package.json"
      run: bunx sort-package-json {staged_files}
      stage_fixed: true
    # Prettier decides layout; markdownlint then judges what it produced --
    # never the other order (markdown.md). Covers YAML too, named in the
    # glob rather than left to *.md alone -- otherwise this quietly never
    # formats lefthook.yml or a workflow file.
    prettier-md:
      glob: "*.{md,yml,yaml}"
      run: bunx prettier --write {staged_files}
      stage_fixed: true
    markdownlint:
      glob: "*.md"
      run: bunx markdownlint-cli2 --fix {staged_files}
      stage_fixed: true
    # Style advice, not a gate -- reports, doesn't block a commit.
    vale:
      glob: "*.md"
      run: scripts/lint-prose.sh {staged_files} || true
    # Scoped by the CI `docker` group (hook-guard.sh), so a commit touching
    # nothing the image reads skips it -- containers.md.
    docker-build:
      run: >
        .github/scripts/hook-guard.sh docker --
        sh -c 'go build -o pipeline-analytics ./cmd/pipeline-analytics &&
        docker build -t pipeline-analytics:pre-commit-check . &&
        docker rmi pipeline-analytics:pre-commit-check &&
        rm -f pipeline-analytics'

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}

# Never writes. Whole-tree checks, same commands CI runs, so a mistake
# costs a local run instead of a full CI round trip. Each job runs through
# hook-guard.sh, which asks .github/scripts/changes.sh whether the job's CI
# group changed since origin/main, so a hook runs on exactly the files its
# CI job does and a path added to changes.sh reaches both. The first
# argument names the group; hook-guard.test.sh covers the lookup.
pre-push:
  parallel: true
  commands:
    go-vet:
      run: >
        mkdir -p "$HOME/.cache/go-build-docker" "$HOME/.cache/go-mod-docker" &&
        .github/scripts/hook-guard.sh --push go --
        docker run --rm --user "$(id -u):$(id -g)"
        -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOMODCACHE=/gomod -v "$HOME/.cache/go-mod-docker:/gomod"
        golang:1.27.1-bookworm go vet ./...
    go-test:
      run: >
        mkdir -p "$HOME/.cache/go-build-docker" "$HOME/.cache/go-mod-docker" &&
        .github/scripts/hook-guard.sh --push go --
        docker run --rm --user "$(id -u):$(id -g)"
        -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOMODCACHE=/gomod -v "$HOME/.cache/go-mod-docker:/gomod"
        golang:1.27.1-bookworm go test -race -cover ./...
    go-mod-tidy:
      run: >
        mkdir -p "$HOME/.cache/go-build-docker" "$HOME/.cache/go-mod-docker" &&
        .github/scripts/hook-guard.sh --push go --
        docker run --rm --user "$(id -u):$(id -g)"
        -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOMODCACHE=/gomod -v "$HOME/.cache/go-mod-docker:/gomod"
        golang:1.27.1-bookworm go mod tidy -diff
    go-mod-fmt-check:
      run: >
        mkdir -p "$HOME/.cache/go-build-docker" "$HOME/.cache/go-mod-docker" &&
        .github/scripts/hook-guard.sh --push go --
        docker run --rm --user "$(id -u):$(id -g)"
        -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOMODCACHE=/gomod -v "$HOME/.cache/go-mod-docker:/gomod"
        golang:1.27.1-bookworm sh -c 'go mod edit -fmt -print go.mod | diff -u go.mod -'
    golangci-lint:
      run: >
        mkdir -p "$HOME/.cache/go-build-docker" "$HOME/.cache/golangci-lint-docker" &&
        .github/scripts/hook-guard.sh --push lint --
        docker run --rm --user "$(id -u):$(id -g)"
        -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOLANGCI_LINT_CACHE=/cache -v "$HOME/.cache/golangci-lint-docker:/cache"
        golangci/golangci-lint:v2.13.2 golangci-lint run ./...
    spectral:
      run: .github/scripts/hook-guard.sh --push api -- bunx spectral lint --display-only-failures openapi/openapi.yaml
    redocly:
      run: .github/scripts/hook-guard.sh --push api -- bunx @redocly/cli lint
    goreleaser-check:
      run: >
        .github/scripts/hook-guard.sh --push goreleaser --
        docker run --rm -v "$(pwd):/src" -w /src
        -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/src
        --entrypoint goreleaser goreleaser/goreleaser:v2.17.1 check
    sort-package-json-check:
      run: .github/scripts/hook-guard.sh --push package -- bunx sort-package-json --check package.json web/package.json
    frontend-check:
      root: "web/"
      run: ../.github/scripts/hook-guard.sh --push web -- bun run check
    frontend-lint:
      root: "web/"
      run: ../.github/scripts/hook-guard.sh --push web -- bun run lint
    frontend-lint-tailwind:
      root: "web/"
      run: ../.github/scripts/hook-guard.sh --push web -- bun run lint:tailwind
    frontend-test:
      root: "web/"
      run: ../.github/scripts/hook-guard.sh --push web -- bun run test
    # Fails on a surviving mutant, like ci.yml's mutation job.
    frontend-mutation:
      root: "web/"
      run: ../.github/scripts/hook-guard.sh --push web -- bun run test:mutation
    # The Dockerfile only COPYs a prebuilt binary (go-releases.md), so this
    # rebuilds that binary itself before building the image, same shape as
    # ci.yml's docker job.
    hadolint:
      run: .github/scripts/hook-guard.sh --push docker -- sh -c 'docker run --rm -i hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d < Dockerfile'
    docker-build:
      run: .github/scripts/hook-guard.sh --push docker -- sh -c 'go build -o pipeline-analytics ./cmd/pipeline-analytics && docker build -t pipeline-analytics:pre-push . && rm -f pipeline-analytics'
    # Whole tree, not just the prose files mechanics/style below check --
    # this is Prettier's own layout gate, and markdown.md wants YAML named
    # in the glob so lefthook.yml and every workflow file are covered too.
    markdown-format:
      run: .github/scripts/hook-guard.sh --push md -- bunx prettier --check '**/*.{md,yml,yaml}'
    markdown-lint:
      run: .github/scripts/hook-guard.sh --push mdlint -- bunx markdownlint-cli2 "**/*.md"
    # LTeX in pre-push too, not just CI (markdown.md) -- same image CI
    # pulls, so nothing new to keep current on a contributor's machine.
    prose-mechanics:
      run: >
        .github/scripts/hook-guard.sh --push ltex --
        docker run --rm -v "$(pwd):/data" -w /data
        ghcr.io/alrayyes/ltex-cli-plus@sha256:00c30809802234d6c43b0ce0b295075bd0aff9c576aaba57433bc8baf314398c
        --client-configuration=/data/.ltex.json
        README.md CONTRIBUTING.md SECURITY.md .github/PULL_REQUEST_TEMPLATE.md openspec/specs
    # Blocks here, unlike pre-commit's advisory `|| true` copy above --
    # matches CI's own style job (linting.md: hook and CI run the same
    # commands so they can't drift), same file list and all.
    prose-style:
      run: .github/scripts/hook-guard.sh --push vale -- scripts/lint-prose.sh
